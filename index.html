<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e293b" />
    <title>Notes</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button {
        font-size: 16px;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: #334155;
        color: #fff;
      }
      button.on {
        background: #f59e0b;
        color: #111;
      }
      .card {
        background: #1e293b;
        border-radius: 12px;
        padding: 14px;
        margin: 12px 0;
      }
      .t {
        font-size: 32px;
        font-weight: 700;
        margin: 4px 0;
      }
      .small {
        font-size: 13px;
        opacity: 0.8;
      }
      .stop {
        background: #dc2626;
        width: 100%;
        margin-top: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin-top: 8px;
      }
      td,
      th {
        padding: 6px;
        border-bottom: 1px solid #334155;
        text-align: left;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .row button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>Start a task</h1>
    <div id="pick" class="grid"></div>
    <h1 style="margin-top: 20px">Running (<span id="n">0</span>)</h1>
    <div id="running"></div>
    <h1 style="margin-top: 20px">Today</h1>
    <table id="stats"></table>
    <div class="row">
      <button id="exp">Export CSV</button><button id="clr">Clear all</button>
    </div>
    <script>
      const TASKS = [
        "New enrolment",
        "Replacement",
        "Update",
        "Printing",
        "Lamination",
        "Card issuance",
        "Form timing",
        "Replacement form",
        "Update form",
      ];
      const KEY = "tslog";
      const $ = (id) => document.getElementById(id);
      let log = JSON.parse(localStorage.getItem(KEY) || "[]");
      let run = JSON.parse(localStorage.getItem(KEY + "_run") || "[]");
      const old = JSON.parse(localStorage.getItem(KEY + "_cur") || "null");
      if (old) {
        old.id = "m" + Date.now();
        run.push(old);
        localStorage.removeItem(KEY + "_cur");
      }
      const save = () => {
        localStorage.setItem(KEY, JSON.stringify(log));
        localStorage.setItem(KEY + "_run", JSON.stringify(run));
      };
      const mins = (ms) => (ms / 60000).toFixed(1);
      const fmt = (ms) => {
        const s = Math.floor(ms / 1000);
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      };
      const waited = (c, now) => c.wait + (c.waitStart ? now - c.waitStart : 0);
      const find = (id) => run.find((c) => c.id === id);
      TASKS.forEach((t) => {
        const b = document.createElement("button");
        b.textContent = t;
        b.onclick = () => start(t);
        $("pick").appendChild(b);
      });
      function start(t) {
        run.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          task: t,
          start: Date.now(),
          wait: 0,
          waitStart: null,
          ints: 0,
          rej: false,
        });
        save();
        render();
      }
      function render() {
        $("n").textContent = run.length;
        $("running").innerHTML = run
          .map(
            (c) => `<div class="card" data-id="${c.id}">
  <div>${c.task} <span class="small">· started ${new Date(
              c.start
            ).toLocaleTimeString()}</span></div>
  <div class="t" data-el="time">0:00</div>
  <div class="small" data-el="wait"></div>
  <div class="grid" style="margin-top:10px">
   <button data-act="wait" class="${c.waitStart ? "on" : ""}">Waiting</button>
   <button data-act="int">Interrupted (${c.ints})</button>
   <button data-act="rej" class="${
     c.rej ? "on" : ""
   }">Rejected / redone</button>
   <button data-act="cancel">Discard</button>
  </div>
  <button class="stop" data-act="stop">Stop and save</button></div>`
          )
          .join("");
        tick();
      }
      $("running").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const c = find(b.closest(".card").dataset.id);
        if (!c) return;
        const n = Date.now(),
          a = b.dataset.act;
        if (a === "wait") {
          if (c.waitStart) {
            c.wait += n - c.waitStart;
            c.waitStart = null;
          } else c.waitStart = n;
        } else if (a === "int") c.ints++;
        else if (a === "rej") c.rej = !c.rej;
        else if (a === "cancel") {
          if (!confirm("Discard this " + c.task + " entry?")) return;
          run = run.filter((x) => x !== c);
        } else if (a === "stop") {
          const w = waited(c, n);
          if (c.waitStart) c.waitStart = null;
          log.push({
            task: c.task,
            start: c.start,
            end: n,
            total: n - c.start,
            wait: w,
            active: n - c.start - w,
            ints: c.ints,
            rej: c.rej,
          });
          run = run.filter((x) => x !== c);
        }
        save();
        render();
        stats();
      };
      function tick() {
        const n = Date.now();
        document.querySelectorAll("#running .card").forEach((el) => {
          const c = find(el.dataset.id);
          if (!c) return;
          el.querySelector('[data-el="time"]').textContent = fmt(n - c.start);
          el.querySelector('[data-el="wait"]').textContent =
            "Waiting so far: " + fmt(waited(c, n));
        });
      }
      function stats() {
        const today = new Date().toDateString();
        const rows = log.filter(
          (e) => new Date(e.start).toDateString() === today
        );
        let h =
          "<tr><th>Task</th><th>Count</th><th>Avg active</th><th>Avg wait</th></tr>";
        TASKS.forEach((t) => {
          const r = rows.filter((e) => e.task === t);
          if (!r.length) return;
          const a = r.reduce((s, e) => s + e.active, 0) / r.length,
            w = r.reduce((s, e) => s + e.wait, 0) / r.length;
          h += `<tr><td>${t}</td><td>${r.length}</td><td>${mins(
            a
          )} min</td><td>${mins(w)} min</td></tr>`;
        });
        const ints = rows.reduce((s, e) => s + e.ints, 0),
          rej = rows.filter((e) => e.rej).length;
        h += `<tr><td colspan="4">Interruptions: ${ints} · Rejections: ${rej}</td></tr>`;
        $("stats").innerHTML = h;
      }
      $("exp").onclick = async () => {
        if (!log.length) {
          alert(
            run.length
              ? "Nothing saved yet. Tap Stop and save on your running tasks first. Only saved entries are exported."
              : "No entries yet."
          );
          return;
        }
        const head =
          "task,date,start,end,total_min,active_min,wait_min,interruptions,rejected\n";
        const body = log
          .map((e) => {
            const s = new Date(e.start),
              en = new Date(e.end);
            return [
              e.task,
              s.toLocaleDateString(),
              s.toLocaleTimeString(),
              en.toLocaleTimeString(),
              mins(e.total),
              mins(e.active),
              mins(e.wait),
              e.ints,
              e.rej ? "Y" : "N",
            ]
              .map((v) => `"${v}"`)
              .join(",");
          })
          .join("\n");
        const csv = head + body,
          name = "time-study-" + new Date().toISOString().slice(0, 10) + ".csv";
        // 1) Share sheet (works on phones and in home-screen mode)
        try {
          const f = new File([csv], name, { type: "text/csv" });
          if (navigator.canShare && navigator.canShare({ files: [f] })) {
            await navigator.share({ files: [f], title: name });
            return;
          }
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
        // 2) Normal download
        try {
          const url = URL.createObjectURL(
            new Blob([csv], { type: "text/csv" })
          );
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            a.remove();
            URL.revokeObjectURL(url);
          }, 4000);
        } catch (e) {}
        // 3) Copy fallback
        showCopy(csv);
      };
      function showCopy(csv) {
        let box = $("csvbox");
        if (!box) {
          box = document.createElement("div");
          box.id = "csvbox";
          box.className = "card";
          document.body.appendChild(box);
        }
        box.innerHTML = "";
        const p = document.createElement("div");
        p.className = "small";
        p.textContent =
          "If no file downloaded, tap Copy data and paste it into WhatsApp or a note.";
        const ta = document.createElement("textarea");
        ta.value = csv;
        ta.readOnly = true;
        ta.style.cssText =
          "width:100%;height:120px;margin-top:8px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px";
        const b = document.createElement("button");
        b.textContent = "Copy data";
        b.style.cssText = "width:100%;margin-top:8px";
        b.onclick = async () => {
          try {
            await navigator.clipboard.writeText(csv);
          } catch (e) {
            ta.focus();
            ta.select();
            document.execCommand("copy");
          }
          b.textContent = "Copied";
        };
        box.append(p, ta, b);
        box.scrollIntoView({ behavior: "smooth" });
      }
      $("clr").onclick = () => {
        if (confirm("Delete all saved entries? Export first.")) {
          log = [];
          save();
          stats();
        }
      };
      setInterval(tick, 1000);
      render();
      stats();
    </script>
  </body>
</html>
